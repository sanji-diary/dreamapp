<script type="text/x-dc" data-dc-script data-props='{"startLevel":{"editor":"int","default":1,"min":1,"max":6,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
var lv = Number(props && props.startLevel != null ? props.startLevel : 1);
this.state = { level: lv, given: 0, drops: 12, points: 1240, tick: 0, kind: '', busy: false, seed: lv, msg: '' };
this.timers = [];
}
componentDidUpdate() {
var lv = Number(this.props.startLevel != null ? this.props.startLevel : 1);
if (lv !== this.state.seed) {
this.setState({ level: lv, seed: lv, given: 0, drops: 12, kind: '', busy: false, msg: '' });
}
}
componentWillUnmount() {
this.timers.forEach(function (t) { clearTimeout(t); });
}
renderVals() {
var self = this;
var st = this.state;
var names = ['씨앗', '새싹', '어린나무', '큰나무', '꽃나무', '열매나무'];
var lines = [
'씨앗을 심었어요\n물을 주면 싹이 나요',
'새싹이 돋았어요!\n쑥쑥 자라는 중이에요',
'어린나무가 되었어요\n가지가 생겼어요',
'이제 큰나무예요\n곧 꽃이 필 거예요',
'꽃이 피었어요!\n물을 주면 열매가 열려요',
'열매가 열렸어요!\n다 익을 때까지 조금만 더'
];
var needs = [2, 4, 6, 8, 10, 10];
var need = needs[st.level - 1];
var pct = Math.round(Math.min(1, st.given / need) * 100);
var left = Math.max(0, need - st.given);
var ripe = st.level >= 6 && st.given >= need && st.kind !== 'charge';
var s = st.tick % 2 === 1 ? 'A' : 'B';
var charge = st.kind === 'charge';
var reveal = st.kind === 'reveal';
var water = st.kind === 'water';
var wet = water || charge;
var rayColors = ['#FFFFFF', '#FFE27A', '#FFFFFF', '#BFE6A8', '#FFFFFF', '#FFE27A', '#FFFFFF', '#BFE6A8', '#FFFFFF', '#FFE27A'];
var rays = rayColors.map(function (c, i) {
return { deg: (i * 36) + 'deg', color: c, anim: reveal ? ('ray 1s ease-out ' + ((i % 3) * 0.06) + 's both') : 'none' };
});
var leaves = [84, 126, 168, 214, 256, 296].map(function (x, i) {
return { x: x + 'px', anim: charge ? ('leafUp 0.9s ease-out ' + (0.55 + i * 0.07) + 's both') : 'none' };
});
var drops = [150, 170, 190, 210, 230].map(function (x, i) {
return { x: x + 'px', anim: wet ? ('drop' + s + ' 0.75s ease-in ' + (0.4 + (i * 37 % 5) * 0.1) + 's both') : 'none' };
});
return {
is1: st.level === 1, is2: st.level === 2, is3: st.level === 3, is4: st.level === 4, is5: st.level === 5, is6: st.level === 6,
treeLabel: '내 나무: ' + names[st.level - 1],
treeAnim: charge ? 'chargeA 0.75s ease-in 0.85s both' : (reveal ? 'revealA 1s cubic-bezier(0.2, 0.9, 0.3, 1.1) both' : (water ? ('squash' + s + ' 0.6s ease-out 0.75s') : 'none')),
glowAnim: charge ? 'glowIn 0.75s ease-in 0.85s both' : (reveal ? 'glowOut 1s ease-out both' : 'none'),
cloudAnim: wet ? ((s === 'A' ? 'cloudPop' : 'cloudPopB') + ' 1.6s ease-out both') : 'none',
tintOpacity: (charge || reveal) ? 0.9 : 0,
uiOpacity: (wet || reveal) ? 0 : 1,
busy: st.busy,
idle: !st.busy,
busyText: (charge || reveal) ? '쑥쑥 자라는 중…' : '물 주는 중…',
toastAnim: reveal ? ('toast' + s + ' 1.3s ease-out both') : (water ? ('toast' + s + ' 1.2s ease-out 0.5s both') : 'none'),
toastText: reveal ? (names[st.level - 1] + '(으)로 레벨업!') : '물방울 1개를 줬어요',
rays: rays,
leaves: leaves,
drops: drops,
showFly: st.level === 2 || st.level === 3,
showBird: st.level === 4,
showBee: st.level === 5,
showTwinkle: st.level === 6,
points: st.points.toLocaleString('ko-KR') + 'P',
headline: ripe ? '열매가 다 익었어요!\n이제 수확할 수 있어요' : (st.msg === 'level' ? '레벨업!\n몰라보게 자라났어요' : (st.msg === 'water' ? '물 주기 완료!\n왠지 튼튼해 보여요' : lines[st.level - 1])),
levelName: '레벨 ' + st.level + ' ' + names[st.level - 1],
pctText: pct + '%',
pctNum: pct,
nextText: ripe ? '다 자랐어요. 열매를 수확해 보세요' : (st.level >= 6 ? ('다 익을 때까지 물방울 ' + left + '개') : (names[st.level] + '까지 물방울 ' + left + '개')),
dropsText: '물방울 ' + st.drops + '개',
noWaterText: ripe ? '다 자랐어요' : '미션을 하면 받아요',
canWater: st.drops > 0 && !ripe,
noWater: st.drops <= 0 && !ripe,
growing: !ripe,
ripe: ripe,
water: function () {
var c = self.state;
var nd = needs[c.level - 1];
if (c.busy || c.drops <= 0 || (c.level >= 6 && c.given >= nd)) return;
var g = c.given + 1;
if (g >= nd && c.level < 6) {
self.setState({ given: nd, drops: c.drops - 1, tick: c.tick + 1, kind: 'charge', busy: true });
self.timers.push(setTimeout(function () { self.setState({ level: self.state.level + 1, given: 0, kind: 'reveal', msg: 'level' }); }, 1600));
self.timers.push(setTimeout(function () { self.setState({ kind: '', busy: false }); }, 2900));
} else {
self.setState({ given: g, drops: c.drops - 1, tick: c.tick + 1, kind: 'water', busy: true, msg: 'water' });
self.timers.push(setTimeout(function () { self.setState({ kind: '', busy: false }); }, 1800));
}
}
};
}
}
</script>
