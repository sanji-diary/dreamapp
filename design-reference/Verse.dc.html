<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미션 수행 - 말씀 쓰기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;src:url(/_blob/beb6939f9cca6955468f4914f53cc35a) format('woff2')}
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#0B1FA6}a:hover{color:#081780}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<div style="padding: 52px 16px 0 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Missions.dc.html" aria-label="미션 목록으로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #191F28">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="height: 32px; padding: 0 12px; border-radius: 16px; background: #EEF1FB; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #0B1FA6">15P · 물방울 2개</div>
</div>
<div style="padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; line-height: 33px; font-weight: 700; letter-spacing: -0.5px">이번 주 말씀을<br>따라 써 보세요</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6B7684; letter-spacing: -0.2px">시편 23편 1절</p>
</div>
<div style="margin: 18px 20px 0 20px; padding: 20px 18px; border-radius: 16px; background: #F0F3F7">
<p style="margin: 0; font-size: 21px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px"><span style="color: #0B1FA6">{{typedOk}}</span><span style="color: #B3261E; text-decoration: underline">{{typedBad}}</span><span style="color: #8B95A1">{{rest}}</span></p>
</div>
<div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
<label for="verse-input" style="font-size: 14px; font-weight: 600; color: #333D4B">여기에 따라 쓰기</label>
<textarea id="verse-input" onInput="{{ onType }}" placeholder="여호와는 나의…" style="height: 120px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1.500px solid #D1D6DB; background: #FFFFFF; font-size: 17px; line-height: 26px; color: #191F28; resize: none"></textarea>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
<span style="font-size: 13px; color: {{hintColor}}">{{hint}}</span>
<span style="font-size: 13px; font-weight: 700; color: #333D4B">{{countText}}</span>
</div>
<div role="progressbar" aria-label="쓴 만큼" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pctNum}}" style="height: 8px; border-radius: 4px; background: #E5E8EB; overflow: hidden"><div style="width: {{pct}}; height: 8px; border-radius: 4px; background: #3182F6; transition: width 0.2s ease"></div></div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 20px 30px 20px">
<button disabled="{{disabled}}" style="width: 100%; height: 54px; border-radius: 14px; border: none; background: {{btnBg}}; color: {{btnFg}}; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">{{btnLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { text: '' };
}
renderVals() {
var self = this;
var verse = '여호와는 나의 목자시니 내게 부족함이 없으리로다';
var t = this.state.text;
var n = 0;
while (n < t.length && n < verse.length && t[n] === verse[n]) n++;
var bad = t.length > n ? verse.slice(n, Math.min(verse.length, t.length)) : '';
var done = t === verse;
return {
typedOk: verse.slice(0, n),
typedBad: bad,
rest: verse.slice(n + bad.length),
countText: n + ' / ' + verse.length + '자',
pct: Math.round(n / verse.length * 100) + '%',
pctNum: Math.round(n / verse.length * 100),
hint: bad ? '빨간 글자부터 다시 써 보세요' : (done ? '다 썼어요!' : '띄어쓰기도 똑같이 써요'),
hintColor: bad ? '#B3261E' : '#4E5968',
disabled: !done,
btnBg: done ? '#0B1FA6' : '#F0F3F7',
btnFg: done ? '#FFFFFF' : '#4E5968',
btnLabel: done ? '물방울 2개 받기' : '끝까지 쓰면 받을 수 있어요',
onType: function (e) { self.setState({ text: e.target.value }); }
};
}
}
</script>
</body>
</html>
