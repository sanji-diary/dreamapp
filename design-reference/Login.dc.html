<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 - 비밀번호</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;src:url(/_blob/beb6939f9cca6955468f4914f53cc35a) format('woff2')}
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#0B1FA6}a:hover{color:#081780}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<div style="padding: 96px 20px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<img alt="" src="/_blob/41a56f4eb0568f7457b5d12e9ebc6780" style="width: 84px; height: 84px">
<h1 style="margin: 14px 0 0 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.5px; text-align: center">하준아, 반가워!</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4E5968; text-align: center">비밀번호 숫자 4개를 눌러 주세요</p>
<div role="status" aria-label="{{dotsLabel}}" style="margin-top: 26px; display: flex; gap: 16px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<div style="width: 18px; height: 18px; border-radius: 9px; background: {{d.bg}}"></div>
</sc-for>
</div>
<p style="margin: 18px 0 0 0; height: 20px; font-size: 14px; font-weight: 600; color: #0B1FA6">{{doneText}}</p>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px">
<button onClick="{{ k1 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">1</button>
<button onClick="{{ k2 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">2</button>
<button onClick="{{ k3 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">3</button>
<button onClick="{{ k4 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">4</button>
<button onClick="{{ k5 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">5</button>
<button onClick="{{ k6 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">6</button>
<button onClick="{{ k7 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">7</button>
<button onClick="{{ k8 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">8</button>
<button onClick="{{ k9 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">9</button>
<div></div>
<button onClick="{{ k0 }}" style="height: 64px; border: none; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #191F28">0</button>
<button onClick="{{ del }}" aria-label="지우기" style="height: 64px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #191F28"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h13v16H10l-7 -8z"></path><path d="M13.500 11l6 6M19.500 11l-6 6"></path></svg></button>
</div>
<p style="margin: 14px 0 34px 0; font-size: 13px; line-height: 19px; color: #6B7684; text-align: center">카드를 잃어버렸거나 비밀번호를 잊었으면 선생님께 말해 주세요</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pin: '' };
}
renderVals() {
var self = this;
var pin = this.state.pin;
var add = function (d) { return function () { if (self.state.pin.length < 4) self.setState({ pin: self.state.pin + d }); }; };
var out = {
dots: [0, 1, 2, 3].map(function (i) { return { bg: i < pin.length ? '#0B1FA6' : '#E5E8EB' }; }),
dotsLabel: '숫자 ' + pin.length + '개 입력됨',
doneText: pin.length === 4 ? '내 나무로 들어가는 중이에요' : '',
del: function () { self.setState({ pin: self.state.pin.slice(0, -1) }); }
};
for (var i = 0; i < 10; i++) { out['k' + i] = add(String(i)); }
return out;
}
}
</script>
</body>
</html>
