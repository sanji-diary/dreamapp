<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 - 미션 만들기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;src:url(/_blob/beb6939f9cca6955468f4914f53cc35a) format('woff2')}
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#0B1FA6}a:hover{color:#081780}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<div style="padding: 52px 16px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="#" aria-label="관리로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #191F28">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.4px">미션 만들기</h1>
</div>
<div style="padding: 6px 16px 0 16px; display: flex; flex-direction: column; gap: 9px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-title" style="font-size: 14px; font-weight: 600; color: #333D4B">미션 이름</label>
<input id="m-title" placeholder="예: 이번 주 말씀 쓰기" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.500px solid #D1D6DB; background: #FFFFFF; font-size: 16px; color: #191F28">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-desc" style="font-size: 14px; font-weight: 600; color: #333D4B">한 줄 설명</label>
<input id="m-desc" placeholder="예: 시편 23편 1절 따라 쓰기" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.500px solid #D1D6DB; background: #FFFFFF; font-size: 16px; color: #191F28">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #333D4B">어떻게 확인하나요</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{kinds}}" as="c" hint-placeholder-count="4">
<button onClick="{{ c.pick }}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0; border: none; background: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600; display: flex; align-items: center">{{c.label}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #333D4B">보상</span>
<div style="display: flex; gap: 8px">
<div style="flex: 1; height: 64px; box-sizing: border-box; padding: 0 8px 0 12px; border-radius: 12px; background: #F0F3F7; display: flex; align-items: center; gap: 6px">
<img alt="" src="/_blob/12cf795ef119aca33a98772dcb1b8636" style="width: 30px; height: 30px">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4E5968">포인트</span><span style="font-size: 17px; font-weight: 700">{{points}}</span></div>
<button onClick="{{ pDec }}" aria-label="포인트 줄이기" style="width: 32px; height: 44px; border: none; background: none; font-size: 22px; font-weight: 600; color: #333D4B">−</button>
<button onClick="{{ pInc }}" aria-label="포인트 늘리기" style="width: 32px; height: 44px; border: none; background: none; font-size: 22px; font-weight: 600; color: #333D4B">+</button>
</div>
<div style="flex: 1; height: 64px; box-sizing: border-box; padding: 0 8px 0 12px; border-radius: 12px; background: #F0F3F7; display: flex; align-items: center; gap: 6px">
<img alt="" src="/_blob/573e770ae0b3b96e22986de2ee760939" style="width: 30px; height: 30px">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4E5968">물방울</span><span style="font-size: 17px; font-weight: 700">{{drops}}</span></div>
<button onClick="{{ dDec }}" aria-label="물방울 줄이기" style="width: 32px; height: 44px; border: none; background: none; font-size: 22px; font-weight: 600; color: #333D4B">−</button>
<button onClick="{{ dInc }}" aria-label="물방울 늘리기" style="width: 32px; height: 44px; border: none; background: none; font-size: 22px; font-weight: 600; color: #333D4B">+</button>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #333D4B">몇 번 할 수 있나요</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{repeats}}" as="c" hint-placeholder-count="4">
<button onClick="{{ c.pick }}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0; border: none; background: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600; display: flex; align-items: center">{{c.label}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #333D4B">누구에게 보이나요</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{targets}}" as="c" hint-placeholder-count="4">
<button onClick="{{ c.pick }}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0; border: none; background: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600; display: flex; align-items: center">{{c.label}}</span></button>
</sc-for>
</div>
</div>
<div style="height: 48px; padding: 0 14px; border-radius: 12px; background: #F0F3F7; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 14px; color: #4E5968">기간</span><span style="font-size: 15px; font-weight: 700; color: #333D4B">11월 22일 - 11월 28일</span>
</div>
</div>
<div style="padding: 8px 16px 22px 16px">
<button style="width: 100%; height: 52px; border-radius: 12px; border: none; background: #0B1FA6; color: #FFFFFF; font-size: 16px; font-weight: 700; letter-spacing: -0.3px">미션 올리기</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: '말씀 쓰기', repeat: '한 번', target: '전체', points: 15, drops: 2 };
}
renderVals() {
var self = this;
var st = this.state;
var mk = function (key, labels) {
return labels.map(function (l) {
var on = st[key] === l;
return { label: l, on: on ? 'true' : 'false', bg: on ? '#0B1FA6' : '#F0F3F7', fg: on ? '#FFFFFF' : '#4E5968', pick: function () { var o = {}; o[key] = l; self.setState(o); } };
});
};
var bump = function (key, d, min, max) { return function () { var o = {}; o[key] = Math.max(min, Math.min(max, self.state[key] + d)); self.setState(o); }; };
return {
kinds: mk('kind', ['스스로 체크', '글 쓰기', '사진 올리기', '말씀 쓰기', '퀴즈', '게임', 'QR 찍기', '교사 확인']),
repeats: mk('repeat', ['한 번', '매일', '매주']),
targets: mk('target', ['전체', '4학년', '5학년', '6학년']),
points: st.points + 'P',
drops: st.drops + '개',
pDec: bump('points', -5, 0, 100), pInc: bump('points', 5, 0, 100),
dDec: bump('drops', -1, 0, 5), dInc: bump('drops', 1, 0, 5)
};
}
}
</script>
</body>
</html>
