<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미션 수행 - 내 고민 적기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:45 920;font-style:normal;font-display:swap;src:url(/_blob/beb6939f9cca6955468f4914f53cc35a) format('woff2')}
body{margin:0}
button,textarea{font-family:inherit}
button{cursor:pointer}
a{color:#0B1FA6}a:hover{color:#081780}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #191F28; display: flex; flex-direction: column">
<div style="padding: 52px 12px 0 12px; display: flex; align-items: center; justify-content: space-between">
<a href="Missions.dc.html" aria-label="미션 목록으로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #191F28">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="height: 32px; padding: 0 12px; margin-right: 8px; border-radius: 16px; background: #EEF1FB; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #0B1FA6">10P · 물방울 1개</div>
</div>
<div style="padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 25px; line-height: 34px; font-weight: 700; letter-spacing: -0.5px">요즘 마음에 걸리는<br>일이 있나요?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4E5968">작은 일도 괜찮아요. 편하게 적어 주세요.</p>
</div>
<div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
<label for="worry-text" style="font-size: 14px; font-weight: 600; color: #333D4B">내 이야기</label>
<textarea id="worry-text" placeholder="여기에 적어 주세요" style="height: 150px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1.500px solid #D1D6DB; background: #F9FAFB; font-size: 16px; line-height: 24px; color: #191F28; resize: none"></textarea>
</div>
<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
<div id="aud-label" style="font-size: 16px; font-weight: 700">누가 읽으면 좋을까요?</div>
<div role="group" aria-labelledby="aud-label" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
<button onClick="{{ opt.pick }}" aria-pressed="{{opt.pressed}}" style="height: 60px; padding: 0 14px; border-radius: 14px; border: 1.500px solid {{opt.border}}; background: {{opt.bg}}; display: flex; align-items: center; gap: 12px; text-align: left; color: #191F28">
<span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: {{opt.dotBorder}}; background: #FFFFFF; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 0px">
<span style="font-size: 16px; font-weight: 700">{{opt.title}}</span>
<span style="font-size: 13px; color: #4E5968">{{opt.sub}}</span>
</span>
</button>
</sc-for>
</div>
</div>
<div style="padding: 14px 20px 0 20px; display: flex; gap: 8px; align-items: flex-start">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#4E5968" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><rect x="3.500" y="8" width="11" height="7.500" rx="2"></rect><path d="M6 8V6a3 3 0 0 1 6 0v2"></path></svg>
<p style="margin: 0; font-size: 13px; line-height: 19px; color: #4E5968">고른 사람만 읽을 수 있어요. 위험한 일이면 도와주기 위해 다른 어른께 알릴 수 있어요. 지금 바로 도움이 필요하면 청소년상담전화 1388로 전화하세요.</p>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 20px 28px 20px">
<button disabled="{{sendDisabled}}" style="width: 100%; height: 54px; border-radius: 16px; border: none; background: {{sendBg}}; color: {{sendFg}}; font-size: 17px; font-weight: 700">{{sendLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: '' };
}
renderVals() {
var self = this;
var picked = this.state.picked;
var base = [
{ id: 'teacher', title: '박지현 선생님만', sub: '우리 반 담임 선생님' },
{ id: 'pastor', title: '김인성 전도사님만', sub: '소년부 전도사님' },
{ id: 'both', title: '선생님과 전도사님 모두', sub: '두 분이 함께 읽어요' }
];
var options = base.map(function (o) {
var on = picked === o.id;
return {
title: o.title,
sub: o.sub,
pressed: on ? 'true' : 'false',
border: on ? '#0B1FA6' : '#D1D6DB',
bg: on ? '#EEF1FB' : '#FFFFFF',
dotBorder: on ? '7px solid #0B1FA6' : '1.5px solid #8B95A1',
pick: function () { self.setState({ picked: o.id }); }
};
});
var ready = picked !== '';
return {
options: options,
sendDisabled: !ready,
sendBg: ready ? '#0B1FA6' : '#F2F4F6',
sendFg: ready ? '#FFFFFF' : '#4E5968',
sendLabel: ready ? '보내고 물방울 받기' : '읽을 사람을 골라 주세요'
};
}
}
</script>
</body>
</html>
