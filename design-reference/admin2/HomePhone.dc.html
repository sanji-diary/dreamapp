<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴대폰 관리 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#3046d9}a:hover{color:#2236b8}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #f7f8fb; color: #191f28; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.5; letter-spacing: -0.01em">
  <header style="display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 8px 0 16px; background: #ffffff; border-bottom: 1px solid #eef0f4">
    <span aria-hidden="true" style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: {{accent}}; color: #ffffff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-7M12 14c-4 0-6.5-2.6-6.5-6A6.5 6.5 0 0 1 12 1.5 6.5 6.5 0 0 1 18.5 8c0 3.4-2.5 6-6.5 6Z"></path></svg></span>
    <h1 style="flex: 1; margin: 0 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.03em">홈</h1>
    <button type="button" aria-label="알림 3개" style="position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #333d4b">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #c2410c; color: #ffffff; font-size: 10.5px; font-weight: 700">3</span>
    </button>
    <a href="WritePhone.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; text-decoration: none">글쓰기</a>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 16px">
    <p style="margin: 0; font-size: 14px; color: #4e5968">11월 셋째 주 · 15일(주일) ~ 21일(토)</p>

    <section aria-label="이번 주 숫자" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: #ffffff; border: 1px solid #eceef3; border-radius: 16px">
          <span style="font-size: 13px; font-weight: 600; color: #4e5968">{{s.label}}</span>
          <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{s.value}}</span><span style="font-size: 13.5px; color: #4e5968">{{s.unit}}</span></span>
          <span style="font-size: 12.5px; font-weight: {{s.footWeight}}; color: {{s.footColor}}">{{s.foot}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="todo-h" style="background: #ffffff; border: 1px solid #eceef3; border-radius: 16px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
        <h2 id="todo-h" style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em">지금 할 일</h2>
        <span style="display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; background: #fff0e5; color: #9a3412; font-size: 13px; font-weight: 700">4</span>
      </div>
      <ul style="margin: 0; padding: 0 6px 6px; list-style: none">
        <sc-for list="{{todos}}" as="t" hint-placeholder-count="4">
          <li style="border-top: 1px solid #f1f3f6">
            <a href="{{t.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 10px; color: #191f28; text-decoration: none">
              <span aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 11px; background: #f2f4f8; color: {{accent}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4">
                <span style="font-weight: 700">{{t.what}} <span style="color: {{t.countColor}}">{{t.count}}</span></span>
                <span style="font-size: 13px; color: #4e5968">{{t.detail}}</span>
              </span>
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b95a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="cls-h" style="background: #ffffff; border: 1px solid #eceef3; border-radius: 16px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
        <h2 id="cls-h" style="flex: 1; margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em">반별 현황</h2>
        <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; text-decoration: none">반 편성</a>
      </div>
      <ul style="margin: 0; padding: 0 16px 8px; list-style: none">
        <sc-for list="{{classes}}" as="c" hint-placeholder-count="6">
          <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #f1f3f6">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
              <span style="font-weight: 700">{{c.name}}</span>
              <span style="font-size: 13px; color: #6b7684">담임 {{c.teacher}} · 출석 {{c.present}} / {{c.kids}}명</span>
            </span>
            <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: {{c.waitBg}}; color: {{c.waitFg}}; font-size: 12.5px; font-weight: 700; white-space: nowrap">{{c.wait}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <nav aria-label="아래 메뉴" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 68px; padding-bottom: 4px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #eef0f4">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" aria-current="{{b.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{b.color}}; font-size: 12px; font-weight: {{b.weight}}; text-decoration: none">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"></path></svg>
        {{b.label}}
        <sc-if value="{{b.hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 6px; left: calc(50% + 6px); display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #c2410c; color: #ffffff; font-size: 10.5px; font-weight: 700">{{b.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3046d9","options":["#3046d9","#0b1fa6","#5b5fe0","#1b64da"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  tabs(active, accent) {
    const I = {
      home: 'M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M10 20v-5h4v5',
      people: 'M9 4.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 1 0 0-6.4M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M17 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M16 14.2c2.3.2 4 1.8 4.5 4.8',
      attend: 'M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5ZM3.5 9.5h17M8 3v4M16 3v4M9 14.5l2 2 4-4',
      check: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M8.5 12.2l2.4 2.4 4.6-4.8',
      more: 'M4 6h16M4 12h16M4 18h16',
    };
    return [['home', '홈', 'HomePhone.dc.html'], ['people', '교적부', 'StudentsPhone.dc.html'], ['attend', '출석', '#'], ['check', '미션 확인', '#', 8], ['more', '전체 메뉴', '#']].map(([icon, label, href, badge]) => {
      const on = label === active;
      return { d: I[icon], label, href, current: on ? 'page' : undefined, color: on ? accent : '#4e5968', weight: on ? 700 : 500, badge: badge || '', hasBadge: !!badge };
    });
  }
  renderVals() {
    const accent = this.props.accent ?? '#3046d9';
    return {
      accent,
      tabs: this.tabs('홈', accent),
      stats: [
        { label: '주일 출석', value: '25', unit: '/ 32명', foot: '지난주보다 2명 늘었어요', footColor: '#4e5968', footWeight: 500 },
        { label: '확인 기다림', value: '8', unit: '건', foot: '3일 넘은 것 2건', footColor: '#9a3412', footWeight: 600 },
        { label: '모은 물방울', value: '212', unit: '개', foot: '한 명에 7개쯤', footColor: '#4e5968', footWeight: 500 },
        { label: '열매 거둔 아이', value: '3', unit: '명', foot: '이번 달 모두 5명', footColor: '#4e5968', footWeight: 500 },
      ],
      todos: [
        { d: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M8.5 12.2l2.4 2.4 4.6-4.8', what: '미션 확인', count: '8건', countColor: '#9a3412', detail: '5학년 2반 2건은 3일 넘게 기다렸어요', href: '#' },
        { d: 'M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.2A8 8 0 1 1 20 12Z', what: '고민 상담', count: '1건', countColor: '#9a3412', detail: '이서윤 · 전도사님께 보낸 고민이에요', href: '#' },
        { d: 'M5 3.5h4A1.5 1.5 0 0 1 10.5 5v4A1.5 1.5 0 0 1 9 10.5H5A1.5 1.5 0 0 1 3.5 9V5A1.5 1.5 0 0 1 5 3.5ZM15 3.5h4A1.5 1.5 0 0 1 20.5 5v4a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 13.5 9V5A1.5 1.5 0 0 1 15 3.5ZM5 13.5h4a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 9 20.5H5A1.5 1.5 0 0 1 3.5 19v-4A1.5 1.5 0 0 1 5 13.5ZM15 13.5h4a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a1.5 1.5 0 0 1-1.5-1.5v-4a1.5 1.5 0 0 1 1.5-1.5Z', what: '반 정하기', count: '2명', countColor: '#9a3412', detail: '새로 가입한 아이예요', href: '#' },
        { d: 'M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5ZM4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5M12 6.5v7M9.5 9h5', what: '다음 주 말씀', count: '아직 없음', countColor: '#4e5968', detail: '말씀 쓰기에 넣을 말씀을 골라 주세요', href: '#' },
      ],
      classes: [
        ['4학년 1반', '강요셉', 5, 5, 2], ['4학년 2반', '박은혜', 5, 4, 0], ['5학년 1반', '이다니엘', 5, 4, 0],
        ['5학년 2반', '최한나', 5, 3, 5], ['6학년 1반', '정사무엘', 5, 5, 1], ['6학년 2반', '윤에스더', 5, 4, 0],
      ].map(([name, teacher, kids, present, wait]) => ({
        name, teacher, kids, present,
        wait: wait ? '확인 ' + wait + '건' : '확인 끝',
        waitBg: wait ? '#fff0e5' : '#f2f4f6',
        waitFg: wait ? '#9a3412' : '#4e5968',
      })),
    };
  }
}
</script>
</body>
</html>
