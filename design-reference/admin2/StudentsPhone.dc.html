<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴대폰 교적부</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#3046d9}a:hover{color:#2236b8}
</style>
</helmet>
<div style="width: 390px; height: 1140px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #f7f8fb; color: #191f28; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.5; letter-spacing: -0.01em">
  <header style="display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 8px 0 16px; background: #ffffff">
    <h1 style="flex: 1; margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em">교적부 <span style="font-size: 15px; font-weight: 600; color: #4e5968">{{shown}}명</span></h1>
    <a href="#" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px; border-radius: 12px; background: {{tint}}; color: {{accent}}; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>아이 등록</a>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 12px; background: #ffffff; border-bottom: 1px solid #eef0f4">
    <label style="position: relative; display: flex; align-items: center">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">이름으로 찾기</span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13M16 16l4.5 4.5"></path></svg>
      <input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="이름으로 찾기" style="box-sizing: border-box; width: 100%; height: 46px; padding: 0 14px 0 42px; border: 0; border-radius: 12px; background: #f2f4f8; font: inherit; font-size: 15px; color: #191f28">
    </label>
    <div style="display: flex; gap: 8px">
      <label style="position: relative; flex: 1; display: flex; align-items: center">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">반</span>
        <select value="{{cls}}" onChange="{{onCls}}" style="appearance: none; -webkit-appearance: none; box-sizing: border-box; width: 100%; height: 44px; padding: 0 34px 0 12px; border: 1px solid {{clsBorder}}; border-radius: 10px; background: #ffffff; font: inherit; font-size: 14.5px; font-weight: 600; color: #191f28">
          <option value="">모든 반</option>
          <option value="4학년 1반">4학년 1반</option>
          <option value="4학년 2반">4학년 2반</option>
          <option value="5학년 1반">5학년 1반</option>
          <option value="5학년 2반">5학년 2반</option>
          <option value="6학년 1반">6학년 1반</option>
          <option value="6학년 2반">6학년 2반</option>
        </select>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4e5968" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </label>
      <label style="position: relative; flex: 1; display: flex; align-items: center">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">앱 가입</span>
        <select value="{{join}}" onChange="{{onJoin}}" style="appearance: none; -webkit-appearance: none; box-sizing: border-box; width: 100%; height: 44px; padding: 0 34px 0 12px; border: 1px solid {{joinBorder}}; border-radius: 10px; background: #ffffff; font: inherit; font-size: 14.5px; font-weight: 600; color: #191f28">
          <option value="">앱 가입 모두</option>
          <option value="no">가입 전인 아이</option>
          <option value="yes">가입한 아이</option>
        </select>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4e5968" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </label>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 12px 16px 16px">
    <ul style="margin: 0; padding: 0 4px; list-style: none; background: #ffffff; border: 1px solid #eceef3; border-radius: 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <li style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid {{r.line}}">
          <a href="#" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 8px 6px 8px 10px; color: #191f28; text-decoration: none">
            <span aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 50%; background: {{r.avBg}}; color: {{r.avFg}}; font-size: 13px; font-weight: 700; letter-spacing: -0.04em">{{r.short}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; line-height: 1.3">
              <span style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 700">{{r.name}}</span><sc-if value="{{r.notJoined}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; background: #fff0e5; color: #9a3412; font-size: 11.5px; font-weight: 700">가입 전</span></sc-if></span>
              <span style="font-size: 13px; color: #6b7684">{{r.sub}}</span>
              <span role="img" aria-label="{{r.attLabel}}" style="display: inline-flex; align-items: center; gap: 3px">
                <sc-for list="{{r.dots}}" as="d" hint-placeholder-count="4"><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 3px; background: {{d.bg}}; border: 1.5px solid {{d.border}}"></span></sc-for>
                <span style="margin-left: 4px; font-size: 12.5px; color: #4e5968">{{r.attText}}</span>
              </span>
            </span>
          </a>
          <button type="button" aria-label="{{r.callLabel}}" style="display: grid; place-items: center; flex: none; width: 44px; height: 44px; margin-right: 6px; border: 1px solid #e6e9ef; border-radius: 12px; background: #ffffff; color: {{accent}}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5H9l1.5 4.2-2.2 1.5a11 11 0 0 0 6.5 6.5l1.5-2.2 4.2 1.5v3.5a1.6 1.6 0 0 1-1.7 1.6A16.5 16.5 0 0 1 3.9 5.2a1.6 1.6 0 0 1 1.6-1.7Z"></path></svg></button>
        </li>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <li style="padding: 40px 16px; text-align: center; color: #4e5968">조건에 맞는 아이가 없어요</li>
      </sc-if>
    </ul>
  </div>

  <nav aria-label="아래 메뉴" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 68px; padding-bottom: 4px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #eef0f4">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" aria-current="{{b.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{b.color}}; font-size: 12px; font-weight: {{b.weight}}; text-decoration: none">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"></path></svg>
        {{b.label}}
        <sc-if value="{{b.hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 6px; left: calc(50% + 6px); display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #c2410c; color: #ffffff; font-size: 10.5px; font-weight: 700">{{b.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3046d9","options":["#3046d9","#0b1fa6","#5b5fe0","#1b64da"]},"$preview":{"width":390,"height":1140}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', cls: '', join: '' };
  }
  tabs(active, accent) {
    const I = {
      home: 'M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M10 20v-5h4v5',
      people: 'M9 4.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 1 0 0-6.4M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M17 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M16 14.2c2.3.2 4 1.8 4.5 4.8',
      attend: 'M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5ZM3.5 9.5h17M8 3v4M16 3v4M9 14.5l2 2 4-4',
      check: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M8.5 12.2l2.4 2.4 4.6-4.8',
      more: 'M4 6h16M4 12h16M4 18h16',
    };
    return [['home', '홈', 'HomePhone.dc.html'], ['people', '교적부', 'StudentsPhone.dc.html'], ['attend', '출석', '#'], ['check', '미션 확인', '#', 8], ['more', '전체 메뉴', '#']].map(([icon, label, href, badge]) => {
      const on = label === active;
      return { d: I[icon], label, href, current: on ? 'page' : undefined, color: on ? accent : '#4e5968', weight: on ? 700 : 500, badge: badge || '', hasBadge: !!badge };
    });
  }
  renderVals() {
    const accent = this.props.accent ?? '#3046d9';
    const late = accent + '70';
    const s = this.state;
    const AV = [
      { bg: '#e3e9fd', fg: '#2a3cae' }, { bg: '#dcf2e5', fg: '#1d6b3a' }, { bg: '#fcefd0', fg: '#7a4a00' },
      { bg: '#fce4ec', fg: '#a1264f' }, { bg: '#ebe5fb', fg: '#5534b8' }, { bg: '#d9f0f3', fg: '#0f5f6c' },
    ];
    const kids = [
      [1, '김하준', '5학년 2반', '사랑초', [1, 1, 1, 1], true],
      [2, '이서윤', '5학년 2반', '믿음초', [1, 1, 0, 1], true],
      [3, '박도윤', '4학년 1반', '사랑초', [1, 2, 1, 1], true],
      [4, '최지우', '6학년 1반', '소망초', [0, 0, 1, 0], false],
      [5, '정시우', '4학년 2반', '믿음초', [1, 1, 1, 1], true],
      [6, '강하은', '5학년 1반', '사랑초', [1, 1, 1, 2], true],
      [7, '조은우', '6학년 2반', '소망초', [1, 0, 1, 1], true],
      [8, '윤서아', '4학년 1반', '사랑초', [1, 1, 1, 1], true],
      [9, '장예준', '6학년 1반', '믿음초', [0, 1, 1, 1], false],
      [10, '임지아', '5학년 1반', '소망초', [1, 1, 0, 0], true],
    ];
    const visible = kids.filter((k) =>
      (!s.cls || k[2] === s.cls) &&
      (!s.join || (s.join === 'no' ? !k[5] : k[5])) &&
      (!s.q || k[1].indexOf(s.q.trim()) !== -1));
    const filtered = !!(s.cls || s.join || s.q);
    return {
      accent,
      tint: accent + '14',
      tabs: this.tabs('교적부', accent),
      shown: filtered ? visible.length : 32,
      q: s.q,
      cls: s.cls,
      join: s.join,
      onQ: (e) => this.setState({ q: e.target.value }),
      onCls: (e) => this.setState({ cls: e.target.value }),
      onJoin: (e) => this.setState({ join: e.target.value }),
      clsBorder: s.cls ? accent : '#e1e4ea',
      joinBorder: s.join ? accent : '#e1e4ea',
      empty: visible.length === 0,
      rows: visible.map(([id, name, cls, school, att, joined], i) => {
        const came = att.filter((a) => a > 0).length;
        const av = AV[id % AV.length];
        return {
          name, short: name.slice(1),
          sub: cls + ' · ' + school,
          avBg: av.bg, avFg: av.fg,
          notJoined: !joined,
          line: i === visible.length - 1 ? 'transparent' : '#f1f3f6',
          dots: att.map((a) => ({ bg: a === 1 ? accent : a === 2 ? late : '#ffffff', border: a === 0 ? '#aeb5c0' : 'transparent' })),
          attText: '최근 4주 ' + came + '번',
          attLabel: '최근 4주 가운데 ' + came + '번 나왔어요',
          callLabel: name + ' 보호자에게 전화',
        };
      }),
    };
  }
}
</script>
</body>
</html>
