<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예배 순서</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#3046d9}a:hover{color:#2236b8}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 16px; background: #e8ebf8; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; color: #191f28; font-size: 15px; line-height: 1.5; letter-spacing: -0.01em">
  <div style="display: flex; flex-wrap: wrap; max-width: 1680px; min-height: calc(100vh - 32px); margin: 0 auto; background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(23, 31, 80, 0.05), 0 12px 32px rgba(23, 31, 80, 0.07)">

    <nav aria-label="관리 메뉴" style="flex: 1 1 240px; box-sizing: border-box; display: flex; flex-direction: column; padding: 18px 14px 16px; border-right: 1px solid #eef0f4; background: #ffffff">
      <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 2px 0 8px">
        <span aria-hidden="true" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: {{accent}}; color: #ffffff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-7M12 14c-4 0-6.5-2.6-6.5-6A6.5 6.5 0 0 1 12 1.5 6.5 6.5 0 0 1 18.5 8c0 3.4-2.5 6-6.5 6Z"></path></svg></span>
        <span style="flex: 1; font-size: 19px; font-weight: 800; letter-spacing: -0.03em">꿈의숲</span>
        <button type="button" aria-label="메뉴 접기" style="display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #6b7684"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M19 12H9m0 0 4-4m-4 4 4 4"></path></svg></button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 18px">
          <p style="margin: 0 0 6px; padding: 0 12px; font-size: 12px; font-weight: 600; color: #6b7684">{{g.label}}</p>
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="5">
            <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: {{n.bg}}; color: {{n.color}}; font-size: 15px; font-weight: {{n.weight}}; text-decoration: none">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
              <span style="flex: 1">{{n.name}}</span>
              <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span style="display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: {{n.badgeBg}}; color: {{n.badgeColor}}; font-size: 12px; font-weight: 700">{{n.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 18px">
        <p style="margin: 0 0 6px; padding: 0 12px; font-size: 12px; font-weight: 600; color: #6b7684">선생님</p>
        <sc-for list="{{teachers}}" as="t" hint-placeholder-count="5">
          <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #333d4b; font-size: 14.5px; text-decoration: none">
            <span aria-hidden="true" style="display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: {{t.bg}}; color: {{t.fg}}; font-size: 11px; font-weight: 700; letter-spacing: -0.04em">{{t.short}}</span>
            <span style="flex: 1">{{t.name}}</span>
            <span style="font-size: 12.5px; color: #6b7684">{{t.cls}}</span>
          </a>
        </sc-for>
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: {{accent}}; font-size: 14.5px; font-weight: 600; text-decoration: none">
          <span aria-hidden="true" style="display: grid; place-items: center; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed {{accent}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
          선생님 초대
        </a>
      </div>
      <span style="flex: 1; min-height: 20px"></span>
      <div style="padding-top: 10px; border-top: 1px solid #eef0f4">
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; color: #333d4b; font-size: 15px; text-decoration: none">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"></path></svg>
          <span style="flex: 1">기본 설정</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b95a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </nav>

    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #f7f8fb">
      <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 76px; box-sizing: border-box; padding: 14px 28px; border-bottom: 1px solid #eef0f4; background: #ffffff">
        <label style="position: relative; flex: 0 1 440px; min-width: 200px; display: flex; align-items: center">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">전체에서 찾기</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13M16 16l4.5 4.5"></path></svg>
          <input type="search" placeholder="아이 이름, 반, 글 제목으로 찾기" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px 0 42px; border: 1px solid #e5e8ee; border-radius: 12px; background: #f9fafc; font: inherit; font-size: 14.5px; color: #191f28">
        </label>
        <span style="flex: 1"></span>
        <button type="button" aria-label="알림 3개" style="position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #eceef3; border-radius: 12px; background: #ffffff; color: #333d4b">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"></path></svg>
          <span aria-hidden="true" style="position: absolute; top: 5px; right: 5px; display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #c2410c; color: #ffffff; font-size: 10.5px; font-weight: 700">3</span>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 6px 0 4px; border: 0; border-radius: 12px; background: transparent; font: inherit; color: #191f28; text-align: left">
          <span aria-hidden="true" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: {{tint2}}; color: {{accent}}; font-size: 13px; font-weight: 700">인성</span>
          <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 14.5px; font-weight: 700">김인성 전도사</span><span style="font-size: 12.5px; color: #6b7684">관리자</span></span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7684" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </header>

      <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; padding: 28px 28px 32px">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
          <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
            <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25">예배 순서</h1>
            <p style="margin: 0; font-size: 14px; color: #4e5968">여기 적은 대로 아이들 앱의 예배 화면에 보여요</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <button type="button" onClick="{{copyLast}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid #e1e4ea; border-radius: 12px; background: #ffffff; font: inherit; font-size: 14.5px; font-weight: 600; color: #191f28; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05)">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h10.5v11.5H9ZM5 15.5H4.5V4h11v.5"></path></svg>
              지난 주일 것 가져오기
            </button>
            <button type="button" onClick="{{save}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: {{accent}}; font: inherit; font-size: 14.5px; font-weight: 700; color: #ffffff; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.1)">저장하기</button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px 10px 10px; background: #ffffff; border: 1px solid #eceef3; border-radius: 16px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04)">
          <div style="display: flex; align-items: center; gap: 4px">
            <button type="button" onClick="{{prevWeek}}" aria-label="지난 주일" style="display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #333d4b"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button>
            <span style="min-width: 168px; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: -0.02em">{{weekLabel}}</span>
            <button type="button" onClick="{{nextWeek}}" aria-label="다음 주일" style="display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #333d4b"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
          </div>
          <span style="display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 14px; background: {{weekTagBg}}; color: {{weekTagFg}}; font-size: 13px; font-weight: 700">{{weekTag}}</span>
          <span style="flex: 1"></span>
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: {{saveWeight}}; color: {{saveColor}}">{{saveText}}</span>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
          <section aria-labelledby="info-h" style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 22px 22px; background: #ffffff; border: 1px solid #eceef3; border-radius: 16px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04)">
            <h2 id="info-h" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em">예배 안내</h2>
            <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #333d4b">
                {{f.label}}
                <input type="text" value="{{f.value}}" onChange="{{f.change}}" placeholder="{{f.hint}}" style="box-sizing: border-box; width: 100%; height: 46px; padding: 0 14px; border: 1px solid #e1e4ea; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #191f28">
              </label>
            </sc-for>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #333d4b">
              이번 주 암송 말씀
              <textarea onChange="{{onVerse}}" value="{{verse}}" rows="3" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #e1e4ea; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; line-height: 1.6; color: #191f28; resize: vertical"></textarea>
            </label>
          </section>

          <section aria-labelledby="order-h" style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #eceef3; border-radius: 16px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04)">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 20px 22px 12px">
              <h2 id="order-h" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em">순서</h2>
              <span style="font-size: 13.5px; color: #6b7684">{{count}}개 · 화살표로 순서를 바꿔요</span>
            </div>
            <div style="overflow-x: auto">
              <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14.5px">
                <thead>
                  <tr>
                    <th scope="col" style="width: 44px; height: 44px; padding: 0 0 0 22px; border-bottom: 1px solid #eef0f4; text-align: left; font-size: 13px; font-weight: 600; color: #6b7684">#</th>
                    <th scope="col" style="width: 34%; padding: 0 8px; border-bottom: 1px solid #eef0f4; text-align: left; font-size: 13px; font-weight: 600; color: #6b7684">순서</th>
                    <th scope="col" style="padding: 0 8px; border-bottom: 1px solid #eef0f4; text-align: left; font-size: 13px; font-weight: 600; color: #6b7684">맡은 사람 · 내용</th>
                    <th scope="col" style="width: 130px; padding: 0 18px 0 8px; border-bottom: 1px solid #eef0f4; text-align: right; font-size: 13px; font-weight: 600; color: #6b7684">옮기기 · 빼기</th>
                  </tr>
                </thead>
                <tbody>
                  <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
                    <tr>
                      <td style="height: 62px; padding: 0 0 0 22px; border-bottom: 1px solid #f1f3f6; font-weight: 700; color: #6b7684; font-variant-numeric: tabular-nums">{{it.no}}</td>
                      <td style="padding: 0 8px; border-bottom: 1px solid #f1f3f6"><input type="text" value="{{it.name}}" onChange="{{it.onName}}" aria-label="{{it.nameLabel}}" placeholder="예) 찬양" style="box-sizing: border-box; width: 100%; height: 42px; padding: 0 12px; border: 1px solid #e6e9ef; border-radius: 10px; background: #fbfcfd; font: inherit; font-size: 15px; font-weight: 600; color: #191f28"></td>
                      <td style="padding: 0 8px; border-bottom: 1px solid #f1f3f6"><input type="text" value="{{it.who}}" onChange="{{it.onWho}}" aria-label="{{it.whoLabel}}" placeholder="예) 찬양팀 · 곡 이름" style="box-sizing: border-box; width: 100%; height: 42px; padding: 0 12px; border: 1px solid #e6e9ef; border-radius: 10px; background: #fbfcfd; font: inherit; font-size: 15px; color: #191f28"></td>
                      <td style="padding: 0 18px 0 8px; border-bottom: 1px solid #f1f3f6">
                        <div style="display: flex; justify-content: flex-end; gap: 2px">
                          <button type="button" onClick="{{it.up}}" disabled="{{it.isFirst}}" aria-label="{{it.upLabel}}" style="display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: {{it.upColor}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"></path></svg></button>
                          <button type="button" onClick="{{it.down}}" disabled="{{it.isLast}}" aria-label="{{it.downLabel}}" style="display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: {{it.downColor}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
                          <button type="button" onClick="{{it.del}}" aria-label="{{it.delLabel}}" style="display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #b3261e"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M6.5 6.5l1 13h9l1-13M10.5 10.5v6M13.5 10.5v6"></path></svg></button>
                        </div>
                      </td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
            <div style="padding: 14px 22px 18px">
              <button type="button" onClick="{{add}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border: 1.5px dashed #c3c9d3; border-radius: 12px; background: #fafbfc; font: inherit; font-size: 14.5px; font-weight: 700; color: {{accent}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>순서 더하기</button>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3046d9","options":["#3046d9","#0b1fa6","#5b5fe0","#1b64da"]},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      week: 1,
      dirty: false,
      saved: '11월 14일 오후 9:12에 저장했어요',
      info: { time: '오전 11시 · 소년부실', title: '감사로 들어가는 문', text: '시편 100편 1-5절', who: '김인성 전도사' },
      verse: '감사함으로 그의 문에 들어가며 찬송함으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다 (시편 100:4)',
      next: 8,
      items: [
        [1, '예배로 부름', '인도자'], [2, '찬양', '찬양팀 · 내 주는 강한 성이요'], [3, '대표 기도', '6학년 1반 김하준'], [4, '말씀 읽기', '다 같이 · 시편 100편 1-5절'],
        [5, '말씀', '김인성 전도사'], [6, '헌금', '4학년 2반'], [7, '광고와 축복 기도', '김인성 전도사'],
      ],
    };
  }
  nav(active, accent) {
    const I = {
      home: 'M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M10 20v-5h4v5',
      people: 'M9 4.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 1 0 0-6.4M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M17 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M16 14.2c2.3.2 4 1.8 4.5 4.8',
      attend: 'M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5ZM3.5 9.5h17M8 3v4M16 3v4M9 14.5l2 2 4-4',
      check: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M8.5 12.2l2.4 2.4 4.6-4.8',
      chat: 'M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.2A8 8 0 1 1 20 12Z',
      flag: 'M5 21V4M5 4h11l-2 4 2 4H5',
      doc: 'M6.5 3.5h11A2.5 2.5 0 0 1 20 6v12a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18V6a2.5 2.5 0 0 1 2.5-2.5ZM8 8h8M8 12h8M8 16h5',
      book: 'M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5ZM4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5M12 6.5v7M9.5 9h5',
      grid: 'M5 3.5h4A1.5 1.5 0 0 1 10.5 5v4A1.5 1.5 0 0 1 9 10.5H5A1.5 1.5 0 0 1 3.5 9V5A1.5 1.5 0 0 1 5 3.5ZM15 3.5h4A1.5 1.5 0 0 1 20.5 5v4a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 13.5 9V5A1.5 1.5 0 0 1 15 3.5ZM5 13.5h4a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 9 20.5H5A1.5 1.5 0 0 1 3.5 19v-4A1.5 1.5 0 0 1 5 13.5ZM15 13.5h4a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a1.5 1.5 0 0 1-1.5-1.5v-4a1.5 1.5 0 0 1 1.5-1.5Z',
      coin: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1.1 1.6 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.2 0-2.1-.5-2.6-1.3M12 6.5V8M12 16v1.5',
      qr: 'M4 4h6v6H4ZM14 4h6v6h-6ZM4 14h6v6H4ZM14 14h2v2h-2ZM18 18h2v2h-2ZM14 18h2M18 14h2',
    };
    const groups = [
      ['자주 쓰는 메뉴', [['home', '홈', 'Main.dc.html'], ['people', '교적부', 'Students.dc.html'], ['attend', '출석', '#'], ['check', '미션 확인', '#', 8], ['chat', '고민 상담', '#', 1]]],
      ['운영', [['flag', '미션 계획', 'Missions.dc.html'], ['doc', '소식 글', 'Posts.dc.html'], ['book', '예배 순서', 'Worship.dc.html'], ['grid', '반 편성', 'Classes.dc.html'], ['coin', '달란트', '#'], ['qr', 'QR 카드', '#']]],
    ];
    return groups.map(([label, items]) => ({
      label,
      items: items.map(([icon, name, href, badge]) => {
        const on = name === active;
        return { d: I[icon], name, href, current: on ? 'page' : undefined, bg: on ? accent : 'transparent', color: on ? '#ffffff' : '#333d4b', weight: on ? 600 : 500, badge: badge || '', hasBadge: !!badge, badgeBg: on ? '#ffffff' : '#c2410c', badgeColor: on ? accent : '#ffffff' };
      }),
    }));
  }
  teachers() {
    const AV = [
      { bg: '#e3e9fd', fg: '#2a3cae' }, { bg: '#dcf2e5', fg: '#1d6b3a' }, { bg: '#fcefd0', fg: '#7a4a00' },
      { bg: '#fce4ec', fg: '#a1264f' }, { bg: '#ebe5fb', fg: '#5534b8' },
    ];
    return [['강요셉', '4-1반'], ['박은혜', '4-2반'], ['이다니엘', '5-1반'], ['최한나', '5-2반'], ['정사무엘', '6-1반']]
      .map(([name, cls], i) => ({ name, cls, short: name.slice(1), bg: AV[i].bg, fg: AV[i].fg }));
  }
  change(patch) {
    this.setState(Object.assign({ dirty: true }, patch));
  }
  move(i, by) {
    const items = this.state.items.slice();
    const j = i + by;
    if (j < 0 || j >= items.length) return;
    const t = items[i];
    items[i] = items[j];
    items[j] = t;
    this.change({ items });
  }
  edit(id, col, value) {
    this.change({ items: this.state.items.map((x) => (x[0] === id ? (col === 1 ? [x[0], value, x[2]] : [x[0], x[1], value]) : x)) });
  }
  renderVals() {
    const accent = this.props.accent ?? '#3046d9';
    const s = this.state;
    const weeks = [['11월 8일 주일', '지난 주일', '#f2f4f6', '#4e5968'], ['11월 15일 주일', '이번 주일', accent + '1a', accent], ['11월 22일 주일', '다음 주일', '#fff0e5', '#9a3412']];
    const w = weeks[s.week];
    const list = s.items;
    const info = s.info;
    const field = (key, label, hint) => ({ label, hint, value: info[key], change: (e) => this.change({ info: Object.assign({}, info, { [key]: e.target.value }) }) });
    return {
      accent,
      tint2: accent + '1c',
      groups: this.nav('예배 순서', accent),
      teachers: this.teachers(),
      weekLabel: w[0],
      weekTag: w[1],
      weekTagBg: w[2],
      weekTagFg: w[3],
      prevWeek: () => this.setState({ week: Math.max(0, s.week - 1) }),
      nextWeek: () => this.setState({ week: Math.min(2, s.week + 1) }),
      saveText: s.dirty ? '고친 내용이 아직 저장되지 않았어요' : s.saved,
      saveColor: s.dirty ? '#9a3412' : '#4e5968',
      saveWeight: s.dirty ? 700 : 500,
      save: () => this.setState({ dirty: false, saved: '방금 저장했어요' }),
      copyLast: () => this.change({}),
      fields: [
        field('time', '시간과 장소', '예) 오전 11시 · 소년부실'),
        field('title', '말씀 제목', '예) 감사로 들어가는 문'),
        field('text', '본문', '예) 시편 100편 1-5절'),
        field('who', '말씀 전하는 분', '예) 김인성 전도사'),
      ],
      verse: s.verse,
      onVerse: (e) => this.change({ verse: e.target.value }),
      count: list.length,
      items: list.map(([id, name, who], i) => ({
        no: i + 1, name, who,
        nameLabel: (i + 1) + '번째 순서 이름', whoLabel: (i + 1) + '번째 맡은 사람과 내용',
        upLabel: (name || '이 순서') + ' 위로', downLabel: (name || '이 순서') + ' 아래로', delLabel: (name || '이 순서') + ' 빼기',
        isFirst: i === 0, isLast: i === list.length - 1,
        upColor: i === 0 ? '#c3c9d3' : '#333d4b', downColor: i === list.length - 1 ? '#c3c9d3' : '#333d4b',
        onName: (e) => this.edit(id, 1, e.target.value),
        onWho: (e) => this.edit(id, 2, e.target.value),
        up: () => this.move(i, -1), down: () => this.move(i, 1),
        del: () => this.change({ items: list.filter((x) => x[0] !== id) }),
      })),
      add: () => this.change({ items: list.concat([[s.next, '', '']]), next: s.next + 1 }),
    };
  }
}
</script>
